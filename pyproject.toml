[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab — an in-depth, narrated Python quantitative-trading course and reusable toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantLab" }]

# Runtime dependencies needed by the quantlab package itself. The full course
# (TA-Lib, vectorbt, ML, dashboard) installs from requirements.txt — see
# Module 0 for the TA-Lib C-library setup note.
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Everything the lessons use, grouped so you can install just what you need.
data = ["polars>=0.20", "duckdb>=0.10", "yfinance>=0.2.40"]
indicators = ["TA-Lib>=0.4.28", "pandas-ta>=0.3.14b0"]
backtest = ["vectorbt>=0.26", "numba>=0.59", "quantstats>=0.0.62"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.3", "optuna>=3.6"]
app = ["streamlit>=1.33", "plotly>=5.20"]
test = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
